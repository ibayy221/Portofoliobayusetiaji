<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="spicyGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bgGrad)"/>
  <circle cx="400" cy="550" r="350" fill="url(#spicyGlow)"/>

  <!-- Top Badge -->
  <rect x="250" y="50" width="300" height="36" rx="18" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  <text x="400" y="73" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">HOT &amp; SPICY SIGNATURE</text>

  <!-- Title -->
  <text x="400" y="170" font-family="'Impact', sans-serif" font-size="90" font-weight="900" fill="#71717a" text-anchor="middle" letter-spacing="6">TANTAN</text>
  <text x="400" y="250" font-family="'Impact', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">RAMEN</text>

  <text x="400" y="295" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">RICH SESAME BROTH • ARTISAN NOODLES</text>

  <!-- Graphics Spicy Bowl (Monochrome) -->
  <g transform="translate(400, 570)">
    <!-- Bowl Base -->
    <ellipse cx="0" cy="170" rx="200" ry="25" fill="#000000" opacity="0.9"/>
    <path d="M-210,0 C-190,150 190,150 210,0 Z" fill="#09090b" stroke="#ffffff" stroke-width="5"/>
    
    <!-- Broth -->
    <ellipse cx="0" cy="0" rx="200" ry="55" fill="#27272a"/>
    <ellipse cx="0" cy="-3" rx="180" ry="45" fill="#18181b"/>

    <circle cx="-30" cy="-10" r="25" fill="#3f3f46"/>
    <circle cx="20" cy="-5" r="30" fill="#52525b"/>
    
    <!-- Egg -->
    <ellipse cx="60" cy="-10" rx="28" ry="20" fill="#ffffff"/>
    <ellipse cx="60" cy="-10" rx="16" ry="12" fill="#18181b"/>
  </g>

  <!-- Price Tag (Monochrome) -->
  <g transform="translate(400, 830)">
    <rect x="-150" y="-30" width="300" height="60" rx="30" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle">IDR 98.000++</text>
  </g>

  <!-- Footnote -->
  <text x="400" y="960" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">KUNOICHI JAPANESE RESTAURANT • MERCURE KARAWANG</text>
</svg>
