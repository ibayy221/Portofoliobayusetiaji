<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bgGrad)"/>

  <text x="60" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" letter-spacing="3">CUE CORNER DISTRIBUTOR</text>
  <text x="740" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">CATALOG 2026</text>

  <text x="400" y="180" font-family="'Space Grotesk', sans-serif" font-size="60" font-weight="900" fill="#71717a" text-anchor="middle" letter-spacing="4">PRODUCT CATALOG</text>
  <text x="400" y="260" font-family="'Space Grotesk', sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">&amp; BRANDING</text>
  <text x="400" y="305" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">BILLIARD CUES • SHAFTS • CHALKS • ACCESSORIES</text>

  <!-- Cue Stick Product Graphics (Monochrome) -->
  <g transform="translate(400, 560)">
    <!-- 3 Parallel Premium Cue Sticks -->
    <rect x="-120" y="-220" width="16" height="440" rx="8" fill="#52525b" stroke="#ffffff" stroke-width="2"/>
    <rect x="-8" y="-250" width="16" height="500" rx="8" fill="#18181b" stroke="#ffffff" stroke-width="3"/>
    <rect x="104" y="-220" width="16" height="440" rx="8" fill="#52525b" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Badge (Monochrome Black & White) -->
  <g transform="translate(400, 840)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">OFFICIAL DISTRIBUTOR BRANDING</text>
  </g>

  <text x="400" y="960" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">CUE CORNER • GRAPHIC DESIGN &amp; VISUAL IDENTITY</text>
</svg>
