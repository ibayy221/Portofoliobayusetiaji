<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bgGrad)"/>
  <circle cx="400" cy="550" r="350" fill="url(#neonGlow)"/>

  <!-- Top Badge -->
  <text x="60" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" letter-spacing="3">CUE CORNER // DISTRIBUTOR BILLIARD</text>
  <text x="740" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">VIDEO PRODUCTION</text>

  <!-- Title -->
  <text x="400" y="180" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="900" fill="#71717a" text-anchor="middle" letter-spacing="4">EQUIPMENT</text>
  <text x="400" y="260" font-family="'Space Grotesk', sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">SHOWCASE</text>

  <!-- Subtitle -->
  <text x="400" y="305" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">TAKE VIDEO • DAILY EDITING • SCRIPTWRITING • SCHEDULING</text>

  <!-- Graphic Billiard Balls & Cue Stick (Monochrome Noir) -->
  <g transform="translate(400, 560)">
    <!-- Billiard Cue Sticks Crossed -->
    <line x1="-240" y1="-200" x2="240" y2="200" stroke="#71717a" stroke-width="12" stroke-linecap="round"/>
    <line x1="240" y1="-200" x2="-240" y2="200" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

    <!-- Billiard Balls -->
    <!-- 8 Ball -->
    <circle cx="0" cy="0" r="80" fill="#09090b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="32" fill="#ffffff"/>
    <text x="0" y="10" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" fill="#000000" text-anchor="middle">8</text>

    <!-- 9 Ball -->
    <circle cx="-130" cy="-60" r="55" fill="#27272a" stroke="#ffffff" stroke-width="3"/>
    <rect x="-185" y="-80" width="110" height="40" fill="#ffffff"/>
    <circle cx="-130" cy="-60" r="22" fill="#000000"/>
    <text x="-130" y="-53" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>

    <!-- 1 Ball -->
    <circle cx="130" cy="60" r="55" fill="#3f3f46" stroke="#ffffff" stroke-width="3"/>
    <circle cx="130" cy="60" r="22" fill="#ffffff"/>
    <text x="130" y="67" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="#000000" text-anchor="middle">1</text>
  </g>

  <!-- Video Play Badge (Strict Black & White) -->
  <g transform="translate(400, 830)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">▶ DAILY REELS &amp; TIKTOK CONTENT</text>
  </g>

  <!-- Footer -->
  <text x="400" y="960" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">CUE CORNER DISTRIBUTOR BILLIARD • CONTENT PRODUCER</text>
</svg>
