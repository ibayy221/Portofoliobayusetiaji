<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bgGrad)"/>

  <text x="70" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" letter-spacing="3">KUNOICHI JAPANESE RESTAURANT</text>
  <text x="730" y="80" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">FAMILY PACKAGE</text>

  <text x="400" y="170" font-family="'Cinzel', serif, 'Playfair Display'" font-size="64" font-weight="900" fill="#71717a" text-anchor="middle" letter-spacing="8">KAZOKU</text>
  <text x="400" y="250" font-family="'Cinzel', serif, 'Playfair Display'" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">SHABU SHABU</text>
  <text x="400" y="295" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">PREMIUM JAPANESE HOTPOT FOR 4 - 6 PERSONS</text>

  <!-- Shabu Pot Art (Monochrome) -->
  <g transform="translate(400, 560)">
    <ellipse cx="0" cy="160" rx="230" ry="30" fill="#000000" opacity="0.9"/>
    <path d="M-230,0 C-200,160 200,160 230,0 Z" fill="#18181b" stroke="#ffffff" stroke-width="5"/>
    
    <!-- Pot Center Split -->
    <ellipse cx="0" cy="0" rx="220" ry="60" fill="#09090b"/>
    <ellipse cx="-70" cy="-5" rx="100" ry="45" fill="#27272a"/>
    <ellipse cx="70" cy="-5" rx="100" ry="45" fill="#3f3f46"/>

    <!-- Beef Slices (Monochrome) -->
    <ellipse cx="-70" cy="-10" rx="40" ry="20" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
    <ellipse cx="70" cy="-10" rx="40" ry="20" fill="#71717a" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Price Badge -->
  <g transform="translate(400, 830)">
    <rect x="-160" y="-30" width="320" height="60" rx="30" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle">IDR 560.000++</text>
  </g>

  <text x="400" y="960" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">SERVES 4-6 PERSONS • PREMIUM BEEF SLICES • FARM VEGETABLES</text>
</svg>
